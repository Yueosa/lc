[package]
name = "liancomment"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[[bin]]
name = "lc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
rustix = { version = "1", features = ["fs", "termios"] }
shlex = "1.3"
unicode-width = "0.2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"

[[test]]
name = "cli"
path = "test/cli.rs"
